name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Configure project scratch root
        run: |
          echo "PROJECT_TMP_BASE=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PROJECT_TMP_ROOT=$RUNNER_TEMP/pve-microvm" >> "$GITHUB_ENV"

      - name: Install profiling tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind qemu-system-x86

      - name: Run tests
        run: make test-profile

      - name: Upload concise test profiling conclusions
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-conclusions
          path: docs/profiling/
          retention-days: 14

  build-kernel:
    name: Build microvm kernel
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Configure project scratch root
        run: |
          echo "PROJECT_TMP_BASE=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PROJECT_TMP_ROOT=$RUNNER_TEMP/pve-microvm" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential flex bison bc libelf-dev libssl-dev wget \
            cpio busybox-static qemu-system-x86 erofs-utils iproute2 iptables apparmor apparmor-utils

      - name: Cache kernel source
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/pve-microvm/cache/kernel/linux-*.tar.xz
          key: kernel-source-${{ hashFiles('kernel/version') }}

      - name: Build kernel
        run: |
          make kernel
          ls -lh "$PROJECT_TMP_ROOT/build/kernel/vmlinuz-microvm" "$PROJECT_TMP_ROOT/build/kernel/initrd-microvm"
          file "$PROJECT_TMP_ROOT/build/kernel/vmlinuz-microvm"

      - name: Boot kernel and verify security, filesystems and TUN routing
        run: bash tests/boot-landlock.sh "$PROJECT_TMP_ROOT/build/kernel/vmlinuz-microvm"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v5
        with:
          name: kernel-artifacts
          path: |
            ${{ runner.temp }}/pve-microvm/build/kernel/vmlinuz-microvm
            ${{ runner.temp }}/pve-microvm/build/kernel/initrd-microvm
            ${{ runner.temp }}/pve-microvm/build/kernel/kernel-config
          retention-days: 7

  build-deb:
    name: Build Debian package
    runs-on: ubuntu-24.04
    needs: build-kernel
    steps:
      - uses: actions/checkout@v5

      - name: Configure project scratch root
        run: |
          echo "PROJECT_TMP_BASE=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PROJECT_TMP_ROOT=$RUNNER_TEMP/pve-microvm" >> "$GITHUB_ENV"

      - name: Download kernel artifact
        uses: actions/download-artifact@v5
        with:
          name: kernel-artifacts
          path: ${{ runner.temp }}/pve-microvm/build/kernel/

      - name: Verify kernel
        run: |
          ls -lh ${{ runner.temp }}/pve-microvm/build/kernel/vmlinuz-microvm
          file ${{ runner.temp }}/pve-microvm/build/kernel/vmlinuz-microvm

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev debhelper fakeroot build-essential

      - name: Build .deb
        run: |
          make deb
          mkdir -p "$PROJECT_TMP_ROOT/build/dist"
          find "$PROJECT_TMP_ROOT/build/deb" -name 'pve-microvm_*.deb' -exec cp {} "$PROJECT_TMP_ROOT/build/dist/" \;

      - name: Inspect package contents
        run: |
          dpkg-deb -c "$PROJECT_TMP_ROOT"/build/dist/pve-microvm_*.deb
          echo "---"
          dpkg-deb -I "$PROJECT_TMP_ROOT"/build/dist/pve-microvm_*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: pve-microvm-deb
          path: ${{ runner.temp }}/pve-microvm/build/dist/pve-microvm_*.deb
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [build-kernel, build-deb]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Configure project scratch root
        run: |
          echo "PROJECT_TMP_BASE=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "PROJECT_TMP_ROOT=$RUNNER_TEMP/pve-microvm" >> "$GITHUB_ENV"

      - name: Download kernel
        uses: actions/download-artifact@v5
        with:
          name: kernel-artifacts
          path: ${{ runner.temp }}/pve-microvm/build/release/

      - name: Download .deb
        uses: actions/download-artifact@v5
        with:
          name: pve-microvm-deb
          path: ${{ runner.temp }}/pve-microvm/build/release/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ runner.temp }}/pve-microvm/build/release/vmlinuz-microvm
            ${{ runner.temp }}/pve-microvm/build/release/initrd-microvm
            ${{ runner.temp }}/pve-microvm/build/release/kernel-config
            ${{ runner.temp }}/pve-microvm/build/release/pve-microvm_*.deb
          body_path: RELEASE_NOTES.md
          draft: false

      - name: Publish .deb to GitHub Packages (OCI)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Route publisher scratch and auth configuration through the same root.
          source tools/pve-microvm-env.sh
          pve_microvm_env publish
          export DOCKER_CONFIG="$PVE_MICROVM_RUN_DIR/docker"
          mkdir -p "$DOCKER_CONFIG"
          cd "$PVE_MICROVM_RUN_DIR"
          # Install oras for OCI artifact push
          ORAS_VERSION="1.3.2"
          curl -sLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar xzf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" oras
          chmod +x oras

          # Login to ghcr.io with the workflow GITHUB_TOKEN
          echo "${{ secrets.GITHUB_TOKEN }}" | ./oras login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Push .deb as an OCI artifact
          ORAS="$PVE_MICROVM_RUN_DIR/oras"
          cd "$PROJECT_TMP_ROOT/build/release"
          DEB=$(ls pve-microvm_*.deb)
          "$ORAS" push "ghcr.io/${{ github.repository }}:${TAG}" \
            --artifact-type application/vnd.debian.binary-package \
            "${DEB}:application/vnd.debian.binary-package"

          echo "Published ${DEB} to ghcr.io/${{ github.repository }}:${TAG}"
